name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check shared plugin copies
        run: python scripts/sync-shared.py --check
      - name: Test Python core
        run: python -m unittest discover -s tests
      - name: Test shared and installed plugin hooks
        run: node --experimental-strip-types --test plugins/shared/harness.test.ts plugins/copilot/hooks/harness.test.ts plugins/vscode/hooks/harness.test.ts plugins/shared/runtime.test.ts plugins/shared/policy.test.ts plugins/shared/rubric.test.ts
      - name: Test Claude Code plugin hooks
        run: node --no-warnings --experimental-strip-types --import ./plugins/claude-code/test-support/register.mjs --test plugins/claude-code/hooks/register.test.ts plugins/claude-code/hooks/rubric.test.ts
